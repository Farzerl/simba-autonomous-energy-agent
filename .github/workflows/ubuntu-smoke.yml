name: Ubuntu smoke test

on:
  push:
  pull_request:

jobs:
  simba-agent-demo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-ubuntu-test.txt
            requirements-ubuntu-agent.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-ubuntu-test.txt
      - name: Validate the ADTC repository contract
        run: python scripts/adtc_preflight.py --allow-placeholders
      - name: Run both headless resilience missions
        run: python scripts/smoke_test_agent.py
      - name: Test the lightweight API
        run: python -m pytest -q tests/test_app_server.py tests/test_agent_api.py
